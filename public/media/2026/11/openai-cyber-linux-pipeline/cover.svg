<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Autonomous vulnerability pipeline schematic, illustrative cover</title>
  <desc id="d">Abstract illustration of a five-stage pipeline (discover, validate, exploitability, patch, human review) feeding a Linux kernel silhouette with a lock glyph. Not an official OpenAI image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#12263f"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3dd6c6"/>
      <stop offset="100%" stop-color="#5b8cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="none" stroke="url(#pipe)" stroke-width="6" stroke-linecap="round">
    <path d="M80 315 H1120"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#d7e6ff">
    <g transform="translate(90,250)">
      <rect width="160" height="90" rx="14" fill="#14304d" stroke="#3dd6c6" stroke-width="2"/>
      <text x="80" y="40" text-anchor="middle" font-size="18">Discover</text>
      <text x="80" y="68" text-anchor="middle" font-size="14" fill="#8fb4d8">Scout / Analyst</text>
    </g>
    <g transform="translate(290,250)">
      <rect width="160" height="90" rx="14" fill="#14304d" stroke="#3dd6c6" stroke-width="2"/>
      <text x="80" y="40" text-anchor="middle" font-size="18">Validate</text>
      <text x="80" y="68" text-anchor="middle" font-size="14" fill="#8fb4d8">1,724 vulns</text>
    </g>
    <g transform="translate(490,250)">
      <rect width="180" height="90" rx="14" fill="#14304d" stroke="#5b8cff" stroke-width="2"/>
      <text x="90" y="40" text-anchor="middle" font-size="18">Exploitability</text>
      <text x="90" y="68" text-anchor="middle" font-size="14" fill="#8fb4d8">948 LPE</text>
    </g>
    <g transform="translate(710,250)">
      <rect width="160" height="90" rx="14" fill="#14304d" stroke="#5b8cff" stroke-width="2"/>
      <text x="80" y="40" text-anchor="middle" font-size="18">Patch</text>
      <text x="80" y="68" text-anchor="middle" font-size="14" fill="#8fb4d8">candidates</text>
    </g>
    <g transform="translate(910,250)">
      <rect width="180" height="90" rx="14" fill="#14304d" stroke="#f0c36a" stroke-width="2"/>
      <text x="90" y="40" text-anchor="middle" font-size="18">Human review</text>
      <text x="90" y="68" text-anchor="middle" font-size="14" fill="#8fb4d8">maintainers</text>
    </g>
  </g>
  <g fill="#9ec0e6" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="80" y="120" font-size="42" font-weight="700" fill="#eef5ff">A thousand fewer paths to root</text>
    <text x="80" y="170" font-size="22" fill="#9ec0e6">OpenAI cyber pipeline · Linux kernel · illustrative AgentLab cover</text>
    <text x="80" y="520" font-size="18" fill="#7f9fbf">$1.2M API run · mid-October 2026 campaign · reported Nov 4</text>
    <text x="80" y="560" font-size="16" fill="#5f7f9f">Not affiliated with OpenAI; schematic only; no exploit details depicted</text>
  </g>
</svg>
