<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">AI agents stress-testing legacy RSA-1024, illustrative</title>
  <desc id="d">Abstract illustration of two cooperating agents probing a 1024-bit key while a 2048-bit key stays intact. Not an official Google DeepMind image.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07131f"/><stop offset="100%" stop-color="#1b2a3f"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="90" y="170" width="300" height="190" rx="16" fill="#2a1d24" stroke="#f07a6a" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="240" y="250" text-anchor="middle" font-size="40" fill="#ffd2c8" font-weight="600">RSA-1024</text>
    <text x="240" y="295" text-anchor="middle" font-size="18" fill="#f3a99c">legacy · weaker than assumed</text>
    <rect x="90" y="400" width="300" height="110" rx="16" fill="#16303a" stroke="#5fd3a8" stroke-width="3"/>
    <text x="240" y="455" text-anchor="middle" font-size="30" fill="#c8f5e4" font-weight="600">RSA-2048+</text>
    <text x="240" y="488" text-anchor="middle" font-size="16" fill="#8fd9bd">not affected (per papers)</text>
    <circle cx="520" cy="230" r="42" fill="#24345c" stroke="#8b7cff" stroke-width="3"/><text x="520" y="237" text-anchor="middle" font-size="18" fill="#e8eefc">agent A</text>
    <circle cx="520" cy="350" r="42" fill="#24345c" stroke="#8b7cff" stroke-width="3"/><text x="520" y="357" text-anchor="middle" font-size="18" fill="#e8eefc">agent B</text>
    <line x1="478" y1="240" x2="392" y2="260" stroke="#8b7cff" stroke-width="2"/><line x1="478" y1="345" x2="392" y2="300" stroke="#8b7cff" stroke-width="2"/>
    <text x="640" y="200" font-size="34" fill="#e8eefc" font-weight="600">AI-assisted cryptanalysis</text>
    <text x="640" y="245" font-size="20" fill="#b9c7e6">Google DeepMind · working papers · Nov 2026</text>
    <text x="640" y="310" font-size="20" fill="#f0c36a">1024-bit root: 391 core-years (3.5x less)</text>
    <text x="640" y="350" font-size="20" fill="#f0c36a">batch NFS per key: L[1/3, 1.793]</text>
    <text x="640" y="420" font-size="16" fill="#8fb4d8">AgentLab original illustration · not official art</text>
  </g>
</svg>
