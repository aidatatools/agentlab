<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Hy4 flash open weights, illustrative</title>
  <desc id="d">Abstract illustration of a sparse expert grid where only a few experts light up, a side table of n-gram lookups kept on disk, and a short sliding attention window. Not an official Tencent image.</desc>
