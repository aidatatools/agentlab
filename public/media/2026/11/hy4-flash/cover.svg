    <text x="590" y="380" text-anchor="middle" font-size="18" fill="#bfe6ff">few experts active per token</text>
    <g fill="#f2c94c" opacity="0.85"><rect x="880" y="160" width="200" height="18" rx="4"/><rect x="880" y="186" width="160" height="18" rx="4" opacity="0.7"/><rect x="880" y="212" width="180" height="18" rx="4" opacity="0.8"/><rect x="880" y="238" width="140" height="18" rx="4" opacity="0.6"/><rect x="880" y="264" width="190" height="18" rx="4" opacity="0.75"/></g>
