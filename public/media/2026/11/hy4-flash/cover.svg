      <rect x="420" y="250" width="40" height="40" rx="6"/><rect x="470" y="250" width="40" height="40" rx="6"/><rect x="520" y="250" width="40" height="40" rx="6"/><rect x="570" y="250" width="40" height="40" rx="6"/><rect x="620" y="250" width="40" height="40" rx="6"/><rect x="670" y="250" width="40" height="40" rx="6"/><rect x="720" y="250" width="40" height="40" rx="6"/>
      <rect x="420" y="300" width="40" height="40" rx="6"/><rect x="470" y="300" width="40" height="40" rx="6"/><rect x="520" y="300" width="40" height="40" rx="6"/><rect x="570" y="300" width="40" height="40" rx="6"/><rect x="620" y="300" width="40" height="40" rx="6"/><rect x="670" y="300" width="40" height="40" rx="6"/><rect x="720" y="300" width="40" height="40" rx="6"/>
