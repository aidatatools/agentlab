<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">FlashProve provable inference, illustrative cover</title>
  <desc id="d">Abstract illustration: a model provider commits to hidden model weights once, its GPU attaches a zero-knowledge proof to each reply, and a user checks the proof on an ordinary CPU without the weights. Not an official image.</desc>
  <rect width="1200" height="630" fill="#0b1120"/>
  <text x="600" y="72" fill="#f8fafc" font-family="sans-serif" font-size="36" font-weight="700" text-anchor="middle">Proving which model answered, without revealing it</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="70" y="150" width="300" height="300" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
    <text x="220" y="195" fill="#bae6fd" font-size="22" font-weight="700">Provider (GPU)</text>
    <rect x="110" y="225" width="220" height="70" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="220" y="258" fill="#e2e8f0" font-size="18">hidden weights</text>
    <text x="220" y="280" fill="#94a3b8" font-size="14">400B MoE, 4-bit</text>
    <rect x="110" y="320" width="220" height="90" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="220" y="355" fill="#e2e8f0" font-size="18">prompt + reply</text>
    <text x="220" y="382" fill="#94a3b8" font-size="14">proved in batches</text>
    <rect x="450" y="220" width="300" height="160" rx="18" fill="#111827" stroke="#fcd34d" stroke-width="3"/>
    <text x="600" y="262" fill="#fde68a" font-size="22" font-weight="700">commitment ID</text>
    <text x="600" y="300" fill="#fef3c7" font-size="18">+ zero-knowledge proof</text>
    <text x="600" y="330" fill="#fcd34d" font-size="16">about 19 MB per request</text>
    <rect x="830" y="150" width="300" height="300" rx="18" fill="#111827" stroke="#4ade80" stroke-width="3"/>
    <text x="980" y="195" fill="#bbf7d0" font-size="22" font-weight="700">User (CPU)</text>
    <text x="980" y="270" fill="#e2e8f0" font-size="18">verify in seconds</text>
    <text x="980" y="300" fill="#e2e8f0" font-size="18">no weights, no GPU</text>
    <text x="980" y="370" fill="#4ade80" font-size="44" font-weight="700">YES / NO</text>
  </g>
  <g stroke="#94a3b8" stroke-width="3" fill="none"><path d="M370 300 L445 300"/><path d="M750 300 L825 300"/></g>
  <g fill="#94a3b8"><path d="M445 292 L460 300 L445 308 Z"/><path d="M825 292 L840 300 L825 308 Z"/></g>
  <text x="600" y="560" fill="#64748b" font-family="sans-serif" font-size="18" text-anchor="middle">AgentLab original illustration, not an official Anthropic image</text>
</svg>
