<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Carbon-X illustrative cover</title>
  <desc id="d">Abstract illustration: a DNA sequence split into 6-base tokens flowing into one language model together with an English question, producing an English answer. Not an official image.</desc>
  <rect width="1200" height="630" fill="#0b1324"/>
  <text x="600" y="88" fill="#f8fafc" font-family="sans-serif" font-size="42" font-weight="700" text-anchor="middle">DNA + language in one model</text>
  <g font-family="monospace" font-size="24" text-anchor="middle">
    <rect x="70" y="170" width="150" height="56" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="145" y="206" fill="#d1fae5">ATGGTG</text>
    <rect x="235" y="170" width="150" height="56" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="310" y="206" fill="#d1fae5">CATCTG</text>
    <rect x="400" y="170" width="150" height="56" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="475" y="206" fill="#d1fae5">ACTCCT</text>
  </g>
  <text x="310" y="270" fill="#94a3b8" font-family="sans-serif" font-size="20" text-anchor="middle">one DNA token = 6 bases</text>
  <rect x="70" y="330" width="480" height="70" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="310" y="374" fill="#dbeafe" font-family="sans-serif" font-size="24" text-anchor="middle">"Is this variant benign or pathogenic?"</text>
  <path d="M555 200 L700 290" stroke="#34d399" stroke-width="4" fill="none"/>
  <path d="M555 365 L700 320" stroke="#60a5fa" stroke-width="4" fill="none"/>
  <rect x="700" y="230" width="230" height="150" rx="18" fill="#312e81" stroke="#a5b4fc" stroke-width="3"/>
  <text x="815" y="295" fill="#e0e7ff" font-family="monospace" font-size="30" text-anchor="middle">14.8B</text>
  <text x="815" y="335" fill="#c7d2fe" font-family="sans-serif" font-size="20" text-anchor="middle">single decoder</text>
  <path d="M930 305 L990 305" stroke="#a5b4fc" stroke-width="4"/>
  <rect x="990" y="250" width="160" height="110" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="1070" y="300" fill="#fef3c7" font-family="sans-serif" font-size="22" text-anchor="middle">answer</text>
  <text x="1070" y="330" fill="#fde68a" font-family="sans-serif" font-size="18" text-anchor="middle">in English</text>
  <text x="600" y="570" fill="#94a3b8" font-family="sans-serif" font-size="20" text-anchor="middle">AgentLab original illustration · illustrative only</text>
</svg>
