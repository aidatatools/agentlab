<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">PHP2Shell illustrative cover</title>
  <desc id="d">Abstract illustration: two web requests reaching the same PHP worker, the first leaving stale state that the second consumes. Not an official image.</desc>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="80" y="150" width="260" height="110" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="210" y="200" fill="#e2e8f0" font-family="monospace" font-size="26" text-anchor="middle">Request A</text>
  <text x="210" y="236" fill="#94a3b8" font-family="monospace" font-size="18" text-anchor="middle">OOM / fatal error</text>
  <rect x="80" y="370" width="260" height="110" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="210" y="420" fill="#e2e8f0" font-family="monospace" font-size="26" text-anchor="middle">Request B</text>
  <text x="210" y="456" fill="#94a3b8" font-family="monospace" font-size="18" text-anchor="middle">early INI / upload</text>
  <rect x="520" y="230" width="300" height="170" rx="18" fill="#312e81" stroke="#a5b4fc" stroke-width="3"/>
  <text x="670" y="295" fill="#e0e7ff" font-family="monospace" font-size="30" text-anchor="middle">PHP worker</text>
  <text x="670" y="340" fill="#fca5a5" font-family="monospace" font-size="20" text-anchor="middle">stale global state</text>
  <path d="M340 205 L520 280" stroke="#38bdf8" stroke-width="4" fill="none"/>
  <path d="M340 425 L520 350" stroke="#f87171" stroke-width="4" stroke-dasharray="10 8" fill="none"/>
  <rect x="900" y="250" width="220" height="130" rx="14" fill="#7f1d1d" stroke="#fca5a5" stroke-width="3"/>
  <text x="1010" y="310" fill="#fee2e2" font-family="monospace" font-size="32" text-anchor="middle">RCE</text>
  <text x="1010" y="345" fill="#fecaca" font-family="monospace" font-size="18" text-anchor="middle">CVSS 4.0: 9.2</text>
  <path d="M820 315 L900 315" stroke="#fca5a5" stroke-width="4"/>
  <text x="600" y="90" fill="#f8fafc" font-family="sans-serif" font-size="40" font-weight="700" text-anchor="middle">CVE-2026-109618 / 109619</text>
  <text x="600" y="570" fill="#94a3b8" font-family="sans-serif" font-size="20" text-anchor="middle">AgentLab original illustration · illustrative only</text>
</svg>
