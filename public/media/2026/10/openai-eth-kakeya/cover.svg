<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Three model-produced results under expert review, illustrative cover</title>
  <desc id="d">Abstract illustration with three panels: focusing waves for harmonic analysis, an exponential versus subexponential time curve for 3-SAT, and a lattice gauge field for quantum field theory, above a band reading Lean check and external expert review. Not an official image.</desc>
  <rect width="1200" height="630" fill="#0b1120"/>
  <text x="600" y="72" fill="#f8fafc" font-family="sans-serif" font-size="36" font-weight="700" text-anchor="middle">Model-produced proofs, handed to human shepherds</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="60" y="110" width="340" height="360" rx="20" fill="#111827" stroke="#22d3ee" stroke-width="3"/>
    <text x="230" y="148" fill="#67e8f9" font-size="22" font-weight="700">Harmonic analysis</text>
    <g fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.9">
      <path d="M100 360 Q230 200 360 360"/><path d="M110 380 Q230 240 350 380"/><path d="M120 400 Q230 280 340 400"/><path d="M130 420 Q230 320 330 420"/>
    </g>
    <circle cx="230" cy="250" r="8" fill="#f59e0b"/>
    <text x="230" y="452" fill="#94a3b8" font-size="17">local smoothing, Kakeya</text>
    <rect x="430" y="110" width="340" height="360" rx="20" fill="#111827" stroke="#a78bfa" stroke-width="3"/>
    <text x="600" y="148" fill="#c4b5fd" font-size="22" font-weight="700">Complexity theory</text>
    <line x1="470" y1="420" x2="740" y2="420" stroke="#64748b" stroke-width="2"/><line x1="470" y1="420" x2="470" y2="180" stroke="#64748b" stroke-width="2"/>
    <path d="M470 415 C600 410 680 360 735 190" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M470 415 C600 412 690 395 735 300" fill="none" stroke="#a78bfa" stroke-width="3.5"/>
    <text x="690" y="215" fill="#fca5a5" font-size="16">2^Ω(n)</text>
    <text x="690" y="328" fill="#ddd6fe" font-size="16">2^o(n)</text>
    <text x="600" y="452" fill="#94a3b8" font-size="17">3-SAT, ETH</text>
    <rect x="800" y="110" width="340" height="360" rx="20" fill="#111827" stroke="#f59e0b" stroke-width="3"/>
    <text x="970" y="148" fill="#fcd34d" font-size="22" font-weight="700">Quantum field theory</text>
    <g stroke="#f59e0b" stroke-width="2" opacity="0.8">
      <line x1="860" y1="200" x2="860" y2="400"/><line x1="930" y1="200" x2="930" y2="400"/><line x1="1000" y1="200" x2="1000" y2="400"/><line x1="1070" y1="200" x2="1070" y2="400"/>
      <line x1="840" y1="220" x2="1090" y2="220"/><line x1="840" y1="290" x2="1090" y2="290"/><line x1="840" y1="360" x2="1090" y2="360"/>
    </g>
    <text x="970" y="452" fill="#94a3b8" font-size="17">QCD, Yang–Mills (withheld)</text>
    <rect x="60" y="500" width="1080" height="80" rx="16" fill="#1f2937" stroke="#334155" stroke-width="2"/>
    <text x="600" y="550" fill="#e2e8f0" font-size="24">Lean check  ·  external expert review  ·  not yet peer reviewed</text>
  </g>
</svg>
