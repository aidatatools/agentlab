<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Automated emergent-misalignment red-teaming, illustrative cover</title>
  <desc id="d">Abstract illustration: many red-team agents write candidate fine-tuning datasets disguised as fiction and roleplay; a training-data monitor screens them, passing sets fine-tune a small model that is scored on misalignment evaluations, and results feed a shared log. Not an official image.</desc>
  <rect width="1200" height="630" fill="#0b1120"/>
  <text x="600" y="72" fill="#f8fafc" font-family="sans-serif" font-size="36" font-weight="700" text-anchor="middle">Agents searching for data that slips past the monitor</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#1e293b" stroke="#f472b6" stroke-width="2">
      <rect x="60" y="130" width="200" height="60" rx="12"/><rect x="60" y="210" width="200" height="60" rx="12"/><rect x="60" y="290" width="200" height="60" rx="12"/><rect x="60" y="370" width="200" height="60" rx="12"/>
    </g>
    <g fill="#fbcfe8" font-size="18"><text x="160" y="167">red-team agent</text><text x="160" y="247">red-team agent</text><text x="160" y="327">red-team agent</text><text x="160" y="407">red-team agent</text></g>
    <rect x="320" y="170" width="220" height="220" rx="16" fill="#111827" stroke="#fcd34d" stroke-width="3"/>
    <text x="430" y="210" fill="#fde68a" font-size="20">candidate datasets</text>
    <text x="430" y="250" fill="#cbd5e1" font-size="17">fiction</text><text x="430" y="280" fill="#cbd5e1" font-size="17">roleplay</text><text x="430" y="310" fill="#cbd5e1" font-size="17">"harmless" Q&amp;A</text><text x="430" y="340" fill="#cbd5e1" font-size="17">≤ 5,000 rows</text>
    <rect x="600" y="200" width="180" height="160" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/>
    <text x="690" y="265" fill="#67e8f9" font-size="21">data monitor</text><text x="690" y="295" fill="#94a3b8" font-size="16">flag cap 10% / 100</text>
    <rect x="840" y="200" width="160" height="160" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
    <text x="920" y="265" fill="#c4b5fd" font-size="21">fine-tune</text><text x="920" y="295" fill="#94a3b8" font-size="16">small model</text>
    <rect x="1030" y="200" width="140" height="160" rx="16" fill="#0f172a" stroke="#f87171" stroke-width="3"/>
    <text x="1100" y="265" fill="#fca5a5" font-size="20">misalign.</text><text x="1100" y="292" fill="#fca5a5" font-size="20">evals</text>
    <g stroke="#64748b" stroke-width="3" fill="none"><path d="M260 280 H320"/><path d="M540 280 H600"/><path d="M780 280 H840"/><path d="M1000 280 H1030"/></g>
    <rect x="320" y="460" width="850" height="70" rx="14" fill="#111827" stroke="#34d399" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="745" y="503" fill="#6ee7b7" font-size="20">shared experiment log: later agents refine earlier attempts</text>
    <path d="M1100 360 V460 M160 430 V495 H320" stroke="#34d399" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
    <text x="600" y="595" fill="#64748b" font-size="16">AgentLab original illustration based on the published setup; not an official Anthropic figure</text>
  </g>
</svg>
