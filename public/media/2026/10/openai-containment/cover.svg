<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Red-teaming frontier-model containment, illustrative cover</title>
  <desc id="d">Abstract illustration: nested layers labelled sandbox, microVM, monitoring and network perimeter around an agent, with red-team agents probing the layers from inside. Not an official image.</desc>
  <rect width="1200" height="630" fill="#0b1120"/>
  <text x="600" y="78" fill="#f8fafc" font-family="sans-serif" font-size="38" font-weight="700" text-anchor="middle">Agents red-teaming their own containment</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="250" y="120" width="700" height="440" rx="26" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="600" y="150" fill="#94a3b8" font-size="20">network and cloud perimeter (no live internet)</text>
    <rect x="320" y="175" width="560" height="350" rx="22" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <text x="600" y="205" fill="#67e8f9" font-size="20">monitoring and automatic stop</text>
    <rect x="390" y="230" width="420" height="260" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="3"/>
    <text x="600" y="260" fill="#c4b5fd" font-size="20">microVM (own kernel, hypervisor)</text>
    <rect x="460" y="285" width="280" height="170" rx="14" fill="#1f2937" stroke="#f59e0b" stroke-width="3"/>
    <text x="600" y="315" fill="#fcd34d" font-size="20">restricted container</text>
    <circle cx="600" cy="380" r="34" fill="#10b981"/>
    <text x="600" y="387" fill="#052e16" font-size="20" font-weight="700">agent</text>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#fca5a5">
    <circle cx="140" cy="250" r="22" fill="#ef4444"/><text x="140" y="300" text-anchor="middle">red-team</text>
    <circle cx="1060" cy="250" r="22" fill="#ef4444"/><text x="1060" y="300" text-anchor="middle">red-team</text>
    <path d="M165 250 L385 300" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M1035 250 L815 300" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 6"/>
    <text x="140" y="430" text-anchor="middle">microVM escapes</text>
    <text x="1060" y="430" text-anchor="middle">cache-timing channels</text>
    <text x="600" y="600" text-anchor="middle" fill="#94a3b8">AgentLab original illustration, based on OpenAI's published description</text>
  </g>
</svg>
