# Configuration example, not proof that these providers have been connected.
agents:
  - id: grokbot
    adapter: grok-bot
    enabled: true
    host: minim4.home
    repository_scope: aidatatools/agentlab
    github_identity: agentlab-aidatatools-bot[bot]
  - id: openai-dots
    adapter: unconfigured
    enabled: false
    note: Verify available provider permissions and tools before enabling.
publication:
  human_approval_required: true
  direct_push_main: false
  youtube_upload_enabled: false
