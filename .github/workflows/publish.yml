name: Verify already-deployed site
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_deployment.py --url https://agentlab.aidatatools.com/
# DigitalOcean App Platform handles deployment on main branch push.
# Run this only after the DigitalOcean deployment succeeds; don't assume push == live.
